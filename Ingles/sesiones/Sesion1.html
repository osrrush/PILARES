<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👂 Aprende Inglés - Sesión 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- HEADER -->
        <header class="header">
            <div class="header-content">
                <h1>👂 Aprende Inglés</h1>
                <p class="subtitle">Sesión 1: Mi familia y mi casa</p>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <!-- SECCIÓN DE PALABRAS -->
            <section class="section words-section" id="wordsSection">
                <h2>📚 Palabras de hoy</h2>
                <div class="word-grid" id="wordGrid">
                    <!-- Las palabras se generan con JavaScript -->
                </div>
                <button class="btn btn-primary" id="startExerciseBtn">
                    🚀 ¡Empezar ejercicios!
                </button>
            </section>

            <!-- SECCIÓN DE EJERCICIOS -->
            <section class="section exercises-section" id="exercisesSection" style="display: none;">
                <div class="exercise-progress">
                    <span id="exerciseCounter">Ejercicio 1 de 7</span>
                </div>
                
                <div class="exercise-container" id="exerciseContainer">
                    <!-- Los ejercicios se generan con JavaScript -->
                </div>

                <div class="navigation-buttons">
                    <button class="btn btn-secondary" id="prevBtn" style="display: none;">
                        ⬅ Anterior
                    </button>
                    <button class="btn btn-primary" id="nextBtn">
                        Siguiente ➡
                    </button>
                </div>
            </section>

            <!-- SECCIÓN DE RESULTADOS -->
            <section class="section results-section" id="resultsSection" style="display: none;">
                <div class="results-card">
                    <h2>🎉 ¡Has terminado la sesión!</h2>
                    <div class="results-stats">
                        <div class="stat">
                            <span class="stat-number" id="correctCount">0</span>
                            <span class="stat-label">Correctas</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number" id="wrongCount">0</span>
                            <span class="stat-label">Incorrectas</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number" id="scorePercent">0%</span>
                            <span class="stat-label">Aciertos</span>
                        </div>
                    </div>
                    <button class="btn btn-success" id="restartBtn">
                        🔄 Repetir sesión
                    </button>
                </div>
            </section>

        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <p>💡 Recuerda: ¡Escucha y repite en voz baja!</p>
        </footer>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
